name: API Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  newman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check API key secret
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          if [ -z "$REQRES_API_KEY" ]; then
            echo "::error::Secret REQRES_API_KEY chua duoc tao trong Settings > Secrets and variables > Actions"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and htmlextra reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Newman (Data-Driven)
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: |
          newman run ReqRes_Collection.json \
            -e ReqRes_Environment.json \
            --env-var "baseUrl=https://reqres.in" \
            --env-var "apiKey=$REQRES_API_KEY" \
            -d users.csv \
            --delay-request 300 \
            --timeout-request 15000 \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export report.html

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: report.html
